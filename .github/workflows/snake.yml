name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#DB0A40&color_dots=#ebedf0,#b9cbee,#3671c6,#1b2a5c,#db0a40
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFCC00&color_dots=#161b22,#1b2a5c,#3671c6,#db0a40,#ffcc00

      - name: Push snake to gh-pages branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
