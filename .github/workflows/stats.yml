name: Refresh profile stats

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools brotli

      - name: Render stats and activity cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/stats.py

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/stats.svg assets/activity.svg
          if git commit -m "chore: refresh profile stats"; then
            git pull --rebase origin main
            git push
          fi
