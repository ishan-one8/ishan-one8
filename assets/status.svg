<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">ishan@one8 system status</title>
  <desc id="d">A futuristic terminal panel. user: Ishan Kumar. role: Developer, Builder, Product thinker. craft: Web products, Python projects, AI experiments. stack: Python, TypeScript, React, Next.js, Node.js. loop: Learn, Build, Ship, Improve. current: Turning ideas into useful software. uptime: always shipping.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#04060F"/><stop offset=".6" stop-color="#080C22"/><stop offset="1" stop-color="#130828"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E5FF"/><stop offset=".5" stop-color="#8B5CFF"/><stop offset="1" stop-color="#FF3DCB"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7FA6FF" stroke-opacity=".06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity=".022"/>
    </pattern>
    <filter id="bloom" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="glow"><stop stop-color="#00E5FF" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect x="1" y="1" width="1198" height="358" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; }
    .row { font-size: 17px; animation: row .7s ease-out both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .spin { transform-origin: 200px 196px; animation: spin 14s linear infinite; }
    .spinr { transform-origin: 200px 196px; animation: spin 22s linear infinite reverse; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .sweep { animation: sweep 6s linear infinite; }
    @keyframes row { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .3; } }
    @keyframes sweep { from { transform: translateY(0); } to { transform: translateY(360px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <!-- title bar -->
    <rect width="1200" height="46" fill="#0A1030" fill-opacity=".85"/>
    <path d="M0 46H1200" stroke="url(#neon)" stroke-opacity=".6"/>
    <circle cx="28" cy="23" r="6" fill="#FF5F7E"/><circle cx="48" cy="23" r="6" fill="#FFB547"/><circle cx="68" cy="23" r="6" fill="#3DFFB4"/>
    <text x="600" y="28" text-anchor="middle" font-size="13" fill="#7F96BE" letter-spacing="3">ishan@one8 :: ~/system --status</text>
    <circle class="pulse" cx="1080" cy="23" r="4" fill="#3DFFB4"/>
    <text x="1092" y="27" font-size="11" fill="#3DFFB4" letter-spacing="2">LIVE</text>
    <!-- emblem -->
    <circle cx="200" cy="196" r="130" fill="url(#glow)" opacity=".35"/>
    <circle class="spinr" cx="200" cy="196" r="112" fill="none" stroke="#8B5CFF" stroke-opacity=".55" stroke-dasharray="3 9"/>
    <circle class="spin" cx="200" cy="196" r="96" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="90 30 10 30"/>
    <path d="M200 124l62 36v72l-62 36-62-36v-72z" fill="#0B1638" stroke="url(#neon)" stroke-width="2.5" stroke-linejoin="round" filter="url(#bloom)"/>
    <path d="M200 146l43 25v50l-43 25-43-25v-50z" fill="none" stroke="#00E5FF" stroke-opacity=".3"/>
    <text x="200" y="210" text-anchor="middle" font-family="&quot;Segoe UI&quot;, Ubuntu, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="42" font-weight="900" fill="#EAFBFF" style="font-family:&quot;Segoe UI&quot;, Ubuntu, &quot;Helvetica Neue&quot;, Arial, sans-serif">IK</text>
    <text x="200" y="335" text-anchor="middle" font-size="11" fill="#5E7AA0" letter-spacing="3">ID // ISHAN-ONE8</text>
    <path d="M360 76V330" stroke="#00E5FF" stroke-opacity=".18"/>
    <text x="400" y="88" font-size="17" fill="#8B5CFF" font-weight="700">ishan<tspan fill="#5E7AA0">@</tspan><tspan fill="#FF3DCB">one8</tspan> <tspan fill="#3A4C70">────────────────────────────────</tspan></text>
        <text class="row" style="animation-delay:0.35s" x="400" y="118"><tspan fill="#00E5FF" font-weight="700">user</tspan><tspan x="510" fill="#5E7AA0">::</tspan><tspan x="545" fill="#DDEBFF">Ishan Kumar</tspan></text>
    <text class="row" style="animation-delay:0.67s" x="400" y="148"><tspan fill="#00E5FF" font-weight="700">role</tspan><tspan x="510" fill="#5E7AA0">::</tspan><tspan x="545" fill="#DDEBFF">Developer · Builder · Product thinker</tspan></text>
    <text class="row" style="animation-delay:0.99s" x="400" y="178"><tspan fill="#00E5FF" font-weight="700">craft</tspan><tspan x="510" fill="#5E7AA0">::</tspan><tspan x="545" fill="#DDEBFF">Web products · Python projects · AI experiments</tspan></text>
    <text class="row" style="animation-delay:1.31s" x="400" y="208"><tspan fill="#00E5FF" font-weight="700">stack</tspan><tspan x="510" fill="#5E7AA0">::</tspan><tspan x="545" fill="#DDEBFF">Python · TypeScript · React · Next.js · Node.js</tspan></text>
    <text class="row" style="animation-delay:1.63s" x="400" y="238"><tspan fill="#00E5FF" font-weight="700">loop</tspan><tspan x="510" fill="#5E7AA0">::</tspan><tspan x="545" fill="#DDEBFF">Learn → Build → Ship → Improve</tspan></text>
    <text class="row" style="animation-delay:1.95s" x="400" y="268"><tspan fill="#00E5FF" font-weight="700">current</tspan><tspan x="510" fill="#5E7AA0">::</tspan><tspan x="545" fill="#DDEBFF">Turning ideas into useful software</tspan></text>
    <text class="row" style="animation-delay:2.27s" x="400" y="298"><tspan fill="#00E5FF" font-weight="700">uptime</tspan><tspan x="510" fill="#5E7AA0">::</tspan><tspan x="545" fill="#DDEBFF">always shipping</tspan><tspan class="cursor" fill="#00E5FF">█</tspan></text>
    <g class="row" style="animation-delay:2.59s"><rect x="400" y="330" width="36" height="14" rx="3" fill="#00E5FF"/><rect x="444" y="330" width="36" height="14" rx="3" fill="#3DFFB4"/><rect x="488" y="330" width="36" height="14" rx="3" fill="#8B5CFF"/><rect x="532" y="330" width="36" height="14" rx="3" fill="#FF3DCB"/><rect x="576" y="330" width="36" height="14" rx="3" fill="#FFB547"/><rect x="620" y="330" width="36" height="14" rx="3" fill="#DDEBFF"/></g>
    <rect class="sweep" x="0" y="-40" width="1200" height="40" fill="#00E5FF" opacity=".035"/>
    <rect width="1200" height="360" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="url(#neon)" stroke-opacity=".5" stroke-width="2"/>
</svg>
