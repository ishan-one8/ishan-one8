<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Neon divider">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#04060F"/><stop offset=".6" stop-color="#080C22"/><stop offset="1" stop-color="#130828"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E5FF"/><stop offset=".5" stop-color="#8B5CFF"/><stop offset="1" stop-color="#FF3DCB"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7FA6FF" stroke-opacity=".06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity=".022"/>
    </pattern>
    <filter id="bloom" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" x2="1"><stop stop-color="#00E5FF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FF3DCB" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .p { animation: p 4s ease-in-out infinite; }
    @keyframes p { from { transform: translateX(-220px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .p { animation: none; } }
  </style>
  <path d="M40 14H1160" stroke="url(#neon)" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="M592 14l8-8 8 8-8 8z" fill="#04060F" stroke="url(#neon)" stroke-width="1.5"/>
  <circle cx="40" cy="14" r="3" fill="#00E5FF"/><circle cx="1160" cy="14" r="3" fill="#FF3DCB"/>
  <rect class="p" x="0" y="12.5" width="200" height="3" rx="1.5" fill="url(#fade)" filter="url(#bloom)"/>
</svg>
