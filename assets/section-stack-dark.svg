<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="t d" fill="none">
  <title id="t">03 — Toolkit</title>
  <desc id="d">Section 03: The toolkit.</desc>
  <defs>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17171D"/><stop offset="1" stop-color="#101014"/></linearGradient>
    <linearGradient id="hi" x1="0" x2="1"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="aur" x1="0" x2="1"><stop stop-color="#6366F1"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="headg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#9C9CA6"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FAFAFA" fill-opacity="0.1"/></pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 0.168 0"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.0"/></filter>
  </defs>
  <style>@font-face{font-family:'IK Sans';font-style:normal;font-weight:300 800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IK Serif';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IK Mono';font-style:normal;font-weight:400 600;src:url(data:font/woff2;base64,) format('woff2');}
.f-sans{font-family:'IK Sans',Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-feature-settings:'ss01','cv11';}
.f-serif{font-family:'IK Serif','Instrument Serif',Georgia,serif;font-style:italic;}
.f-mono{font-family:'IK Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>

  <text class="f-mono" x="2" y="26" font-size="11.5" letter-spacing="2" fill="#71717A" text-anchor="start">03  —  TOOLKIT</text>
  <text class="f-sans" x="0" y="80" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#FAFAFA">The <tspan class="f-serif" font-size="46" font-weight="400" letter-spacing="0" fill="url(#aur)">toolkit.</tspan></text>
  <path d="M229 66H1200" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="1196" cy="66" r="3" fill="#71717A"/>
