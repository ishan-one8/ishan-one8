<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-labelledby="t d">
  <title id="t">InterviewOS</title>
  <desc id="d">Project 01: InterviewOS. Adaptive AI technical interviews with a polished, real-time candidate experience. Built with TypeScript, AI, Web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#04060F"/><stop offset=".6" stop-color="#080C22"/><stop offset="1" stop-color="#130828"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E5FF"/><stop offset=".5" stop-color="#8B5CFF"/><stop offset="1" stop-color="#FF3DCB"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7FA6FF" stroke-opacity=".06"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity=".022"/>
    </pattern>
    <filter id="bloom" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="g" cx="1" cy="0" r="1"><stop stop-color="#00E5FF" stop-opacity=".28"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect x="1" y="1" width="588" height="228" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; }
    .border { stroke-dasharray: 160 1500; animation: run 6s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .spin { transform-origin: 520px 62px; animation: spin 12s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -1660; } }
    @keyframes pulse { 50% { opacity: .3; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="590" height="230" fill="url(#bg)"/>
    <rect width="590" height="230" fill="url(#grid)"/>
    <rect width="590" height="230" fill="url(#g)"/>
    <circle class="spin" cx="520" cy="62" r="30" fill="none" stroke="#00E5FF" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="30 12 4 12"/>
    <circle cx="520" cy="62" r="18" fill="none" stroke="#00E5FF" stroke-opacity=".25"/>
    <circle class="pulse" cx="520" cy="62" r="5" fill="#00E5FF" filter="url(#bloom)"/>
    <text x="32" y="44" font-size="12" fill="#00E5FF" letter-spacing="3">PROJECT // 01</text>
    <text x="32" y="86" font-size="28" font-weight="800" fill="#F2FBFF" style="font-family:&quot;Segoe UI&quot;, Ubuntu, &quot;Helvetica Neue&quot;, Arial, sans-serif" letter-spacing="-.5">InterviewOS</text>
    <rect x="32" y="98" width="56" height="3" rx="1.5" fill="#00E5FF" filter="url(#bloom)"/>
    <text x="32" y="124" font-size="15" fill="#A9BCDA" style="font-family:&quot;Segoe UI&quot;, Ubuntu, &quot;Helvetica Neue&quot;, Arial, sans-serif">Adaptive AI technical interviews with a</text><text x="32" y="148" font-size="15" fill="#A9BCDA" style="font-family:&quot;Segoe UI&quot;, Ubuntu, &quot;Helvetica Neue&quot;, Arial, sans-serif">polished, real-time candidate experience.</text>
    <rect x="32" y="172" width="102" height="26" rx="13" fill="#00E5FF" fill-opacity=".1" stroke="#00E5FF" stroke-opacity=".55"/><text x="83" y="189.5" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">TypeScript</text><rect x="144.0" y="172" width="35" height="26" rx="13" fill="#00E5FF" fill-opacity=".1" stroke="#00E5FF" stroke-opacity=".55"/><text x="161" y="189.5" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">AI</text><rect x="188.8" y="172" width="43" height="26" rx="13" fill="#00E5FF" fill-opacity=".1" stroke="#00E5FF" stroke-opacity=".55"/><text x="210" y="189.5" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">Web</text>
    <text x="562" y="190" text-anchor="end" font-size="12" fill="#7F96BE" letter-spacing="2">VIEW REPO →</text>
    <rect width="590" height="230" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="588" height="228" rx="16" fill="none" stroke="#2A3A66" stroke-width="1.5"/>
  <rect class="border" x="1" y="1" width="588" height="228" rx="16" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#bloom)"/>
  <path d="M14 34V14h20M556 216h20v-20" fill="none" stroke="#00E5FF" stroke-width="2"/>
</svg>
