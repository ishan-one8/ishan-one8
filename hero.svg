<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ishan Kumar — building what's next</title>
  <desc id="desc">A futuristic navy banner with animated neon orbit, scanning light, and a product builder message.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#071524"/>
      <stop offset=".52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#17102F"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#55D6FF"/>
      <stop offset=".52" stop-color="#9D8BFF"/>
      <stop offset="1" stop-color="#FF6BB4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6BE4FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6BE4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#80A7D0" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="358" rx="25"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
  </defs>
  <style>
    .scan { animation: scan 8s ease-in-out infinite alternate; }
    .orbit { transform-origin: 991px 180px; animation: spin 24s linear infinite; }
    .orbit-reverse { transform-origin: 991px 180px; animation: spin 32s linear infinite reverse; }
    .float { animation: float 4s ease-in-out infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .dash { stroke-dasharray: 8 15; animation: march 9s linear infinite; }
    @keyframes scan { from { transform: translateX(-140px); opacity: .12; } to { transform: translateX(1230px); opacity: .55; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 50% { transform: translateY(-9px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes march { to { stroke-dashoffset: -230; } }
    @media (prefers-reduced-motion: reduce) { .scan,.orbit,.orbit-reverse,.float,.pulse,.dash { animation: none; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#surface)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1042" cy="170" r="275" fill="url(#glow)" opacity=".32"/>
    <path d="M0 312C285 236 493 370 760 270S1043 223 1200 283" fill="none" stroke="#7B7DFC" stroke-opacity=".18" stroke-width="2"/>
    <path d="M0 332C300 250 531 382 771 296S1059 250 1200 302" fill="none" stroke="#55D6FF" stroke-opacity=".12"/>
    <rect class="scan" x="0" y="0" width="110" height="360" fill="#83D9FF" opacity=".12" filter="url(#blur)"/>
    <g opacity=".92">
      <circle class="orbit" cx="991" cy="180" r="116" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="12 19"/>
      <ellipse class="orbit-reverse" cx="991" cy="180" rx="157" ry="64" fill="none" stroke="#70C9FF" stroke-opacity=".42" stroke-width="1.5"/>
      <circle cx="991" cy="180" r="76" fill="#0D2441" stroke="#67DDF5" stroke-opacity=".65"/>
      <circle class="pulse" cx="991" cy="180" r="55" fill="url(#glow)"/>
      <g class="float">
        <path d="M966 191l25-47 26 47-26 27z" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M966 191h51M991 144v74" fill="none" stroke="#A7ECFF" stroke-opacity=".7"/>
      </g>
      <circle cx="835" cy="180" r="5" fill="#66E6FF"/>
      <circle cx="1107" cy="181" r="5" fill="#D696FF"/>
      <circle cx="991" cy="64" r="5" fill="#68D9FF"/>
      <circle cx="991" cy="296" r="5" fill="#FF86D8"/>
    </g>
    <g font-family="Arial,Helvetica,sans-serif">
      <rect x="56" y="42" width="183" height="28" rx="14" fill="#123047" stroke="#4DADCF" stroke-opacity=".65"/>
      <circle class="pulse" cx="74" cy="56" r="4" fill="#77F0DB"/>
      <text x="87" y="61" fill="#9BE9F3" font-size="12" font-weight="700" letter-spacing="2">OPEN TO BUILD</text>
      <text x="54" y="139" fill="#F3F8FF" font-size="62" font-weight="800" letter-spacing="-2">ISHAN KUMAR</text>
      <rect x="56" y="158" width="500" height="4" rx="2" fill="url(#accent)"/>
      <text x="55" y="214" fill="#A5E7FF" font-size="31" font-weight="700" letter-spacing="1">BUILDING WHAT'S NEXT</text>
      <text x="57" y="250" fill="#A9B8CF" font-size="17" letter-spacing=".8">Software engineering  /  AI  /  Products</text>
      <text x="57" y="312" fill="#718BA7" font-size="13" letter-spacing="2">LEARN  →  BUILD  →  SHIP  →  IMPROVE</text>
      <text x="1128" y="324" text-anchor="end" fill="#87A6C3" font-size="12" letter-spacing="1.5">@ISHAN-ONE8</text>
    </g>
    <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="url(#accent)" stroke-opacity=".48" stroke-width="2"/>
  </g>
</svg>
